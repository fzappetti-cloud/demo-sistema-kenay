<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEMO Kenay – Cobranza y clientes</title>
<style>
  :root{
    --bg:#f4f1ea; --card:#fff; --ink:#1f2933; --muted:#6b7280; --line:#d9d4c7;
    --brand:#1d5fa8; --ok:#1e8e4e; --warn:#c77700; --bad:#c0392b; --new:#7b2cbf;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
  .demo-bar{background:#222;color:#ffd84d;text-align:center;font-weight:700;padding:6px 8px;font-size:14px;letter-spacing:.5px}
  .rolebar{display:flex;background:#fff;border-bottom:1px solid var(--line)}
  .rolebar a{flex:1;text-align:center;padding:12px 4px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;border-bottom:4px solid transparent}
  .rolebar a.on{border-bottom-color:var(--brand);color:var(--brand);background:#eef4fb}
  main{max-width:640px;margin:0 auto;padding:12px}
  h1{font-size:22px;margin:8px 0 12px}
  h2{font-size:19px;margin:16px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  label{display:block;font-weight:600;margin:10px 0 4px}
  select,input[type=text],input[type=date],textarea{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}
  textarea{min-height:130px}
  button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;min-height:52px;background:var(--brand);color:#fff;width:100%;cursor:pointer}
  button.sec{background:#e8e4d8;color:var(--ink)}
  button.ok{background:var(--ok)}
  button.bad{background:var(--bad)}
  button:disabled{background:#c9c9c9;color:#777;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center}
  .row>*{flex:1}
  .gap{height:8px}
  .tag{display:inline-block;font-size:13px;font-weight:800;padding:3px 8px;border-radius:99px;color:#fff;vertical-align:middle;background:#888;white-space:nowrap;flex:0 0 auto;align-self:center}
  .mon{white-space:nowrap}
  .tag.par{background:#2b7bb9} .tag.av{background:var(--warn)} .tag.ok{background:var(--ok)} .tag.no{background:#888} .tag.new{background:var(--new)} .tag.bad{background:var(--bad)}
  .muted{color:var(--muted);font-size:15px}
  .line{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
  .line:last-child{border-bottom:0}
  .fila{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin-bottom:8px}
  .saldo{font-size:22px;font-weight:800;white-space:nowrap}
  .fila>span:first-child{min-width:0}
  .saldo.deuda{color:var(--bad)}
  .grande{font-size:30px;font-weight:800}
  .msg{background:#e9f7ef;border:2px solid var(--ok);border-radius:12px;padding:12px;margin-bottom:10px}
  .warn{background:#fff8e6;border:2px solid var(--warn);border-radius:12px;padding:12px;margin-bottom:10px}
  .err{color:var(--bad);font-weight:700;margin:8px 0}
  .seg{display:flex;gap:8px;margin-bottom:10px}
  .seg button{background:#e8e4d8;color:var(--ink)}
  .seg button.on{background:var(--brand);color:#fff}
  .avrow{display:flex;gap:10px;align-items:stretch;margin-bottom:8px}
  .avrow input[type=checkbox]{width:30px;height:30px;align-self:center;flex:0 0 auto}
  .avrow .fila{margin:0;flex:1}
  .tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#222;padding:6px;gap:4px;z-index:5}
  .tabs button{background:#444;font-size:12px;padding:6px 2px;min-height:52px;line-height:1.15;position:relative}
  .tabs button.on{background:var(--brand)}
  .tabs .ic{display:block;font-size:20px}
  .tabs .bdg{position:absolute;top:2px;right:6px;background:var(--bad);color:#fff;border-radius:99px;font-size:12px;padding:0 6px;min-width:18px}
  .wa{background:#e5ddd5;border-radius:12px;padding:14px;margin:8px 0}
  .bubble{background:#dcf8c6;border-radius:10px 10px 0 10px;padding:8px 10px;margin-left:auto;max-width:90%;white-space:pre-wrap;word-wrap:break-word;font-size:16px;box-shadow:0 1px 1px rgba(0,0,0,.15)}
  .bubble small{display:block;text-align:right;color:#667;font-size:11px;margin-top:2px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
  .acc .fila{border:0;border-radius:0}
  .acc.abierto{border-color:var(--brand)}
  .det{padding:4px 12px 14px;border-top:1px solid var(--line);background:#fbfaf7}
  .bol,.pit{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fff}
  .edit{background:#fff8e6;border:1px solid var(--warn);border-radius:10px;padding:10px;margin-top:8px}
  .chk{display:flex;gap:10px;align-items:center;font-weight:500;margin:6px 0;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .chk input{width:26px;height:26px;flex:0 0 auto}
  .chk.off{opacity:.5}
  .grande2{font-size:22px;font-weight:800;margin:10px 0 0}
  .chip{width:auto;min-height:40px;padding:8px 12px;margin:6px 0 0;font-size:15px}
  details summary{cursor:pointer;min-height:36px}
  img.comp{display:block;margin-top:8px;max-width:100%;border:1px solid var(--line);border-radius:8px}
  @media print{.tabs,.rolebar{display:none}}
</style>
</head>
<body>
<div class="demo-bar">DEMO – datos ficticios – Fase 2: Cobranza y CRM</div>
<div class="rolebar"><a href="pedido.html">👤 Cliente</a><a href="index.html#lista">🏭 Distribuidora</a><a href="cobranza.html" class="on">💰 Cobranza y clientes</a></div>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>

<script src="datos.js"></script>
<script>
// Tanda 3: la pestaña Mensajes (['mensajes','💬','Mensajes']) está construida pero oculta; se vuelve a sumar acá.
const TABS = [['cuentas','💳','Cuenta corriente'],['ficha','🗂️','Ficha de cliente'],['seguir','🔎','Seguimiento']];
const hash = location.hash.replace('#','');
let st = {
  tab: TABS.some(t => t[0] === hash) ? hash : 'cuentas',
  filtro: hash === 'avisos' ? 'avisos' : 'todos',   // todos | avisos | venc
  abiertos: new Set(),      // clientes con el desplegable abierto
  avSel: new Set(),         // avisos tildados para confirmar en bloque
  ed: {},                   // edición de monto/fecha por aviso
  pe: {},                   // panel "Registrar pago en la entrega" por cliente
  verComp: new Set(),       // comprobantes desplegados
  fichaId: null, obs: null,
  m: {tipo:'dia', cid:null, texto:''},
  flash: ''
};
const $app = document.getElementById('app');
let S = null; // datos de la fase 2 (se recargan en cada render)

function guardar(){ if (!f2Save(S)) st.flash = '⚠ No hay espacio para guardar. Cargá de nuevo los datos de ejemplo.'; }
function go(tab){ st.tab = tab; st.obs = null; render(); window.scrollTo(0,0); }
function flash(t){ st.flash = t; }

/* ---------- consultas ---------- */
const pendientes = () => S.avisos.filter(a => a.estado === 'avisado');
function pedidoPendiente(c){ return dbLoad().pedidos.find(p => p.clienteId === c.id && !p.confirmado); }
function ordenes(c){
  const o = S.boletas.filter(b => b.clienteId === c.id).map(b => ({fecha: b.pedidoFecha || b.fecha, items: b.items}));
  const p = pedidoPendiente(c);
  if (p) o.push({fecha: p.fecha || hoyISO(), items: p.items, pend: true});
  return o.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
}
const enPausa = c => /paus/i.test((S.fichas[c.id] || {}).obs || '');
const nombreCli = id => { const c = clienteDe(id); return c ? c.nombre : '(cliente borrado)'; };
const num = v => parseInt(String(v).replace(/\D/g, ''), 10) || 0;
const TAG_BOLETA = {'Pendiente':'no', 'Pago avisado':'av', 'Parcial':'par', 'Pagada':'ok'};
function textoAsign(asign){
  return (asign || []).map(x => { const b = S.boletas.find(y => y.id === x.boletaId);
    return b ? `boleta del ${fmtFecha(b.fecha).slice(0, 5)}: ${fmt(x.monto)}` : fmt(x.monto); }).join(' · ');
}

/* =====================================================
   1. CUENTA CORRIENTE (todo en un lugar, con desplegables)
   ===================================================== */
function rCuentas(){
  const todos = clientesTodos().map(c => ({c, saldo: f2Saldo(S, c.id), inf: infosDe(S, c.id), av: pendientes().filter(a => a.clienteId === c.id)}));
  const deben = todos.filter(x => x.saldo > 0).sort((a, b) => b.saldo - a.saldo);
  const sinDeuda = todos.filter(x => x.saldo <= 0);
  const venc = x => x.inf.some(i => i.vencida && i.resta > 0);
  const lista = st.filtro === 'avisos' ? deben.filter(x => x.av.length) : st.filtro === 'venc' ? deben.filter(venc) : deben;
  const fb = (k, t, n) => `<button class="${st.filtro === k ? 'on' : ''}" onclick="st.filtro='${k}';render()">${t} (${n})</button>`;
  const nSel = [...st.avSel].filter(id => pendientes().some(a => a.id === id)).length;
  let h = `<h1>Cuenta corriente</h1>
  <p class="muted">Tocá un cliente para ver sus boletas, pagos y avisos.</p>
  <div class="seg">${fb('todos', 'Todos', deben.length)}${fb('avisos', 'Avisos por confirmar', deben.filter(x => x.av.length).length)}${fb('venc', 'Vencidos', deben.filter(venc).length)}</div>`;
  if (st.filtro === 'avisos') h += `<button class="ok" ${nSel ? '' : 'disabled'} onclick="confirmarSel()">Confirmar seleccionados (${nSel})</button><div class="gap"></div>`;
  h += lista.length ? lista.map(x => rFila(x, st.filtro === 'avisos')).join('') : '<div class="card muted">No hay clientes en este filtro.</div>';
  h += `<details class="card" style="margin-top:12px"><summary><b>Clientes sin deuda (${sinDeuda.length})</b></summary>${sinDeuda.map(x => rFila(x, false)).join('') || '<p class="muted">Nadie.</p>'}</details>
  <div class="gap"></div>
  <button class="sec" onclick="reiniciar()">Cargar datos de ejemplo de nuevo</button>
  <div class="gap"></div>
  <button class="bad" onclick="limpiarHistorial()">Limpiar historial (empezar de cero)</button>`;
  return h;
}
function rFila(x, conCheck){
  const abierto = st.abiertos.has(x.c.id), venc = x.inf.some(i => i.vencida && i.resta > 0);
  const marcados = x.av.length && x.av.every(a => st.avSel.has(a.id));
  return `<div class="acc ${abierto ? 'abierto' : ''}">
    <div class="avrow" style="margin:0">
      ${conCheck && x.av.length ? `<input type="checkbox" aria-label="Elegir los avisos de ${esc(x.c.nombre)}" ${marcados ? 'checked' : ''} onchange="selCliente(${x.c.id})">` : ''}
      <button class="fila" style="margin:0" onclick="abrirFila(${x.c.id})" aria-expanded="${abierto}">
        <span><b>${abierto ? '▾' : '▸'} ${esc(x.c.nombre)}</b><br>
          ${venc ? '<span class="tag bad">Vencido</span> ' : ''}${x.av.length ? `<span class="tag av">Aviso por confirmar (${x.av.length})</span>` : ''}
          ${!venc && !x.av.length ? `<span class="muted">${x.saldo > 0 ? 'Debe' : 'Al día'}</span>` : ''}</span>
        <span class="saldo ${x.saldo > 0 ? 'deuda' : ''}">${fmt(Math.abs(x.saldo))}</span></button>
    </div>
    ${abierto ? rDetalle(x) : ''}</div>`;
}
function abrirFila(id){ st.abiertos.has(id) ? st.abiertos.delete(id) : st.abiertos.add(id); render(); }
function verCuenta(id){ st.tab = 'cuentas'; st.filtro = 'todos'; st.abiertos.add(id); render(); window.scrollTo(0, 0); }
function selCliente(id){
  const av = pendientes().filter(a => a.clienteId === id), todos = av.every(a => st.avSel.has(a.id));
  av.forEach(a => todos ? st.avSel.delete(a.id) : st.avSel.add(a.id)); render();
}

function rDetalle(x){
  const c = x.c, aCobrar = x.inf.reduce((t, i) => t + i.resta, 0);
  // pagos y avisos, todo junto y discriminado
  const filas = [];
  S.avisos.filter(a => a.clienteId === c.id).forEach(a => filas.push({ts:a.enviadoAt, a}));
  S.pagos.filter(p => p.clienteId === c.id && p.origen !== 'aviso').forEach(p => filas.push({ts:p.ts || (p.fecha + 'T12:00:00'), p}));
  filas.sort((u, v) => u.ts < v.ts ? 1 : -1);
  return `<div class="det">
    <h2 style="margin-top:0">Boletas</h2>
    ${x.inf.length ? x.inf.map(i => `<div class="bol"><div class="line" style="border:0;padding:0"><span><b>${fmtFecha(i.b.fecha)}</b> <span class="muted">${i.etiqueta}</span></span><span class="tag ${TAG_BOLETA[i.estado]}">${i.estado}</span></div>
      <div class="muted">Total ${fmt(i.total)} · Pagado ${fmt(i.pagado)} · <b style="color:var(--ink)">Resta ${fmt(i.resta)}</b></div></div>`).join('') : '<p class="muted">Sin boletas.</p>'}
    <div class="line" style="margin-top:6px"><b>Total a cobrar</b><b class="saldo ${aCobrar > 0 ? 'deuda' : ''}">${fmt(aCobrar)}</b></div>
    <h2>Pagos y avisos</h2>
    ${filas.length ? filas.map(f => f.a ? rAviso(f.a) : rPagoEntrega(f.p)).join('') : '<p class="muted">Sin pagos ni avisos todavía.</p>'}
    <div class="gap"></div>
    ${st.pe[c.id] ? rPanelEntrega(c, x) : `<button class="ok" onclick="abrirEntrega(${c.id})" ${aCobrar > 0 ? '' : 'disabled'}>Registrar pago en la entrega</button>`}
  </div>`;
}
const TAG_AVISO = {avisado:['av', 'Avisado'], confirmado:['ok', 'Confirmado'], descartado:['no', 'Descartado']};
function compHtml(id, comp){
  if (!comp) return '';
  const abierto = st.verComp.has(id);
  return `<button class="sec chip" onclick="togComp('${id}')">📎 ${abierto ? 'Ocultar comprobante' : 'Ver comprobante'}</button>`
    + (abierto ? (comp.tipo === 'img' ? `<img class="comp" src="${comp.data}" alt="Comprobante">` : `<div><button class="sec" onclick="abrirPdf('${id}')">📄 Abrir PDF (${esc(comp.nombre)})</button></div>`) : '');
}
function togComp(id){ st.verComp.has(id) ? st.verComp.delete(id) : st.verComp.add(id); render(); }
function rAviso(a){
  const [cls, txt] = TAG_AVISO[a.estado], e = a.estado === 'avisado' ? edGet(a) : null;
  return `<div class="pit"><div class="line" style="border:0;padding:0"><span><span class="tag ${cls}">${txt}</span> <b>${fmt(a.monto)}</b></span><span class="muted">Transferencia · ${fmtFecha(a.fechaTransf)}</span></div>
    ${a.aNombreDe ? `<div class="muted">A nombre de: <b>${esc(a.aNombreDe)}</b></div>` : ''}
    <div class="muted">Corresponde a: ${textoAsign(a.asign)}</div>
    <div class="muted">Aviso enviado ${fmtFechaHora(a.enviadoAt)}${a.estado === 'confirmado' ? ' · confirmado ' + fmtFechaHora(a.resueltoAt) : a.estado === 'descartado' ? ' · descartado ' + fmtFechaHora(a.resueltoAt) : ''}</div>
    ${compHtml(a.id, a.comprobante)}
    ${e ? `<div class="edit"><p class="muted" style="margin:0 0 4px">Buscá esta transferencia en tu billetera. Si el monto o la fecha no coinciden, corregilos.</p>
      <label for="em-${a.id}">Monto</label><input id="em-${a.id}" type="text" inputmode="numeric" value="${esc(e.monto)}" oninput="st.ed['${a.id}'].monto=this.value">
      <label for="ef-${a.id}">Fecha de la transferencia</label><input id="ef-${a.id}" type="date" max="${hoyISO()}" value="${esc(e.fecha)}" onchange="st.ed['${a.id}'].fecha=this.value">
      ${e.err ? `<div class="err">${esc(e.err)}</div>` : ''}
      <div class="row" style="margin-top:8px"><button class="ok" onclick="confirmarUno('${a.id}')">Confirmar</button><button class="bad" onclick="descartar('${a.id}')">Descartar</button></div></div>` : ''}
  </div>`;
}
function rPagoEntrega(p){
  return `<div class="pit"><div class="line" style="border:0;padding:0"><span><span class="tag ok">Confirmado</span> <b>${fmt(p.monto)}</b></span><span class="muted">${p.forma === 'efectivo' ? 'Efectivo' : 'Transferencia'} · ${fmtFecha(p.fecha)}</span></div>
    ${p.aNombreDe ? `<div class="muted">Pagó a nombre de: <b>${esc(p.aNombreDe)}</b></div>` : ''}
    <div class="muted">Corresponde a: ${textoAsign(p.asign)}</div>
    <div class="muted">Registrado en la entrega${p.tipo === 'parcial' ? ' (pago parcial)' : ''}</div></div>`;
}
function edGet(a){ return st.ed[a.id] = st.ed[a.id] || {monto:String(a.monto), fecha:a.fechaTransf, err:''}; }
function abrirPdf(id){
  const a = S.avisos.find(x => x.id === id);
  fetch(a.comprobante.data).then(r => r.blob()).then(b => window.open(URL.createObjectURL(b), '_blank'));
}

/* ----- confirmar / descartar avisos ----- */
function aplicarConfirmacion(a, monto, fecha){
  if (monto <= 0) return 'Escribí el monto.';
  if (!fecha) return 'Elegí la fecha.';
  if (fecha > hoyISO()) return 'La fecha no puede ser futura.';
  const saldo = f2Saldo(S, a.clienteId);
  if (monto > saldo) return 'El monto supera lo que debe el cliente (' + fmt(saldo) + ').';
  const infos = infosDe(S, a.clienteId);
  // si no se tocó el monto se respeta lo que eligió el cliente; si no, se reasigna desde la boleta más antigua
  const intacto = monto === a.monto && a.asign.every(x => { const i = infos.find(y => y.b.id === x.boletaId); return i && x.monto <= i.resta; });
  const asign = intacto ? a.asign : asignarAntigua(infos, monto, false);
  if (!asign) return 'El monto no entra en las boletas pendientes.';
  const pagoId = nuevoId('pg');
  S.pagos.push({id:pagoId, clienteId:a.clienteId, forma:'transferencia', monto, fecha, aNombreDe:a.aNombreDe || '', tipo:a.modo === 'parcial' ? 'parcial' : 'total',
    origen:'aviso', avisoId:a.id, asign, ts:new Date().toISOString()});
  Object.assign(a, {monto, fechaTransf:fecha, asign, estado:'confirmado', pagoId, resueltoAt:new Date().toISOString()});
  return null;
}
function confirmarUno(id){
  const a = S.avisos.find(x => x.id === id); if (!a || a.estado !== 'avisado') return;
  const e = edGet(a), err = /-/.test(e.monto) ? 'El monto no puede ser negativo.' : aplicarConfirmacion(a, num(e.monto), e.fecha);
  if (err){ e.err = err; return render(); }
  delete st.ed[id]; st.avSel.delete(id); guardar();
  flash('Aviso confirmado. El saldo de ' + nombreCli(a.clienteId) + ' bajó a ' + fmt(f2Saldo(S, a.clienteId)) + '.'); render();
}
function confirmarSel(){
  let n = 0; const fallas = [];
  [...st.avSel].forEach(id => {
    const a = S.avisos.find(x => x.id === id); if (!a || a.estado !== 'avisado') return;
    const err = aplicarConfirmacion(a, a.monto, a.fechaTransf);
    if (err) fallas.push(nombreCli(a.clienteId) + ': ' + err); else { n++; delete st.ed[id]; }
  });
  st.avSel = new Set(); guardar();
  flash(n + ' aviso(s) confirmado(s). Los saldos ya bajaron.' + (fallas.length ? ' No se pudo confirmar: ' + fallas.join(' / ') : '')); render();
}
function descartar(id){
  if (!confirm('¿Descartar este aviso? No afecta el saldo y las boletas vuelven a Pendiente.')) return;
  const a = S.avisos.find(x => x.id === id);
  a.estado = 'descartado'; a.resueltoAt = new Date().toISOString();
  delete st.ed[id]; st.avSel.delete(id); guardar(); flash('Aviso descartado. Las boletas volvieron a Pendiente.'); render();
}

/* ----- registrar pago en la entrega ----- */
function abrirEntrega(cid){ st.pe[cid] = {forma:'efectivo', sel:new Set(), parcial:false, monto:'', fecha:hoyISO(), nombre:'', err:''}; render(); }
function peForma(cid, f){ st.pe[cid].forma = f; render(); }
function peBoleta(cid, bid){ const p = st.pe[cid]; p.sel.has(bid) ? p.sel.delete(bid) : p.sel.add(bid); p.err = ''; render(); }
function peParcial(cid){ const p = st.pe[cid]; p.parcial = !p.parcial; p.sel = new Set(); p.err = ''; render(); }
function cerrarEntrega(cid){ delete st.pe[cid]; render(); }
function rPanelEntrega(c, x){
  const p = st.pe[c.id], pend = x.inf.filter(i => i.resta > 0);
  const aPagar = p.parcial ? null : pend.filter(i => p.sel.has(i.b.id)).reduce((t, i) => t + i.resta, 0);
  return `<div class="edit"><h2 style="margin-top:0">Registrar pago en la entrega</h2>
    <label>Forma de pago</label>
    <div class="seg"><button class="${p.forma === 'efectivo' ? 'on' : ''}" onclick="peForma(${c.id},'efectivo')">Efectivo</button><button class="${p.forma === 'transferencia' ? 'on' : ''}" onclick="peForma(${c.id},'transferencia')">Transferencia</button></div>
    <label>¿Qué boletas paga?</label>
    ${pend.map(i => `<label class="chk ${p.parcial ? 'off' : ''}"><input type="checkbox" ${p.sel.has(i.b.id) ? 'checked' : ''} ${p.parcial ? 'disabled' : ''} onchange="peBoleta(${c.id},'${i.b.id}')">
      <span>${fmtFecha(i.b.fecha)} <span class="muted">${i.etiqueta}</span><br><b>${fmt(i.resta)}</b></span></label>`).join('')}
    <label class="chk"><input type="checkbox" ${p.parcial ? 'checked' : ''} onchange="peParcial(${c.id})"><span><b>Pago parcial (otro monto)</b><br><span class="muted">Se aplica primero a la boleta más antigua</span></span></label>
    ${p.parcial ? `<label for="pe-m-${c.id}">Monto</label><input id="pe-m-${c.id}" type="text" inputmode="numeric" placeholder="Ej: 20000" value="${esc(p.monto)}" oninput="st.pe[${c.id}].monto=this.value">`
      : `<p class="grande2">Se registra: ${fmt(aPagar)}</p>`}
    <label for="pe-f-${c.id}">Fecha</label><input id="pe-f-${c.id}" type="date" max="${hoyISO()}" value="${esc(p.fecha)}" onchange="st.pe[${c.id}].fecha=this.value">
    ${p.forma === 'transferencia' ? `<label for="pe-n-${c.id}">Pagó a nombre de (opcional)</label><input id="pe-n-${c.id}" type="text" placeholder="Si la cuenta es de otra persona" value="${esc(p.nombre)}" oninput="st.pe[${c.id}].nombre=this.value">` : ''}
    <div class="err">${esc(p.err)}</div>
    <button class="ok" onclick="guardarEntrega(${c.id})">Guardar pago</button><div class="gap"></div>
    <button class="sec" onclick="cerrarEntrega(${c.id})">Cancelar</button></div>`;
}
function guardarEntrega(cid){
  const p = st.pe[cid], infos = infosDe(S, cid), saldo = f2Saldo(S, cid);
  const err = t => { p.err = t; render(); };
  let asign, monto;
  if (p.parcial){
    if (/-/.test(p.monto)) return err('El monto no puede ser negativo.');
    monto = num(p.monto);
    if (monto <= 0) return err('Escribí el monto.');
    if (monto > saldo) return err('El monto no puede ser mayor a lo que debe (' + fmt(saldo) + ').');
    asign = asignarAntigua(infos, monto, false);
  } else {
    asign = infos.filter(i => p.sel.has(i.b.id) && i.resta > 0).map(i => ({boletaId:i.b.id, monto:i.resta}));
    if (!asign.length) return err('Tildá la boleta que paga o elegí pago parcial.');
    monto = asign.reduce((t, x) => t + x.monto, 0);
  }
  if (!asign) return err('El monto no entra en las boletas pendientes.');
  if (!p.fecha) return err('Elegí la fecha.');
  if (p.fecha > hoyISO()) return err('La fecha no puede ser futura.');
  S.pagos.push({id:nuevoId('pg'), clienteId:cid, forma:p.forma, monto, fecha:p.fecha, aNombreDe:p.forma === 'transferencia' ? p.nombre.trim() : '',
    tipo:p.parcial ? 'parcial' : 'total', origen:'entrega', asign, ts:new Date().toISOString()});
  delete st.pe[cid]; guardar(); flash('Pago registrado. Saldo actual: ' + fmt(f2Saldo(S, cid))); render();
}

function reiniciar(){
  if (!confirm('¿Cargar de nuevo los datos de ejemplo? Se reemplazan los pagos, avisos y mensajes cargados en esta pantalla.')) return;
  f2Reiniciar(); st.abiertos = new Set(); st.pe = {}; st.ed = {}; st.avSel = new Set(); S = f2Load(); flash('Datos de ejemplo cargados.'); render();
}
function limpiarHistorial(){
  if (!confirm(MSG_LIMPIAR)) return;
  limpiarTodo();
  st = Object.assign(st, {filtro:'todos', abiertos:new Set(), avSel:new Set(), ed:{}, pe:{}, verComp:new Set(), fichaId:null, obs:null, m:{tipo:'dia', cid:null, texto:''}});
  flash('Listo: el historial está en blanco. Podés empezar la prueba de cero.'); render();
}

/* =====================================================
   3. FICHA DE CLIENTE (CRM)
   ===================================================== */
function rFicha(){
  const todos = clientesTodos();
  if (!st.fichaId || !clienteDe(st.fichaId)) st.fichaId = todos[0].id;
  const c = clienteDe(st.fichaId);
  if (st.obs === null) st.obs = (S.fichas[c.id] || {}).obs || '';
  const ord = ordenes(c).slice().reverse(), saldo = f2Saldo(S, c.id);
  const pag = S.pagos.filter(p => p.clienteId === c.id).sort((a, b) => b.fecha < a.fecha ? -1 : 1);
  // pagadores habituales
  const pagadores = {};
  pag.forEach(p => {
    const n = (p.aNombreDe || '').trim().replace(/\s+/g, ' '), k = n.toLowerCase();
    if (n) pagadores[k] = {nombre: (pagadores[k] || {}).nombre || n, n: ((pagadores[k] || {}).n || 0) + 1};
  });
  const listaPag = Object.values(pagadores).sort((a, b) => b.n - a.n).map(x => [x.nombre, x.n]);
  const avPend = pendientes().filter(a => a.clienteId === c.id);
  // productos habituales (en cuántos pedidos aparece cada uno)
  const cuenta = {};
  ordenes(c).forEach(o => o.items.forEach(i => { const k = cuenta[i.productoId] = cuenta[i.productoId] || {n:0, q:0}; k.n++; k.q += i.cant; }));
  const habit = Object.entries(cuenta).sort((a, b) => b[1].n - a[1].n || b[1].q - a[1].q).slice(0, 4);
  return `<h1>Ficha de cliente</h1>
  <select aria-label="Cliente" onchange="st.fichaId=+this.value;st.obs=null;render()">${todos.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('')}</select>
  <div class="gap"></div>
  <div class="card"><h2 style="margin-top:0">Datos ${c.nuevo ? '<span class="tag new">Cliente nuevo</span>' : ''}</h2>
    <div class="line"><span>Negocio</span><b>${esc(c.nombre)}</b></div>
    <div class="line"><span>Teléfono</span><b>${esc(c.tel || '—')}</b></div>
    <div class="line"><span>Dirección de entrega</span><b>${esc(c.dir || '—')}</b></div>
    <div class="line"><span>Día de visita</span><b>${c.diaVisita != null ? DIAS[c.diaVisita] : 'sin definir'}</b></div>
    <div class="line"><span>Lista de precios</span><b>${c.lista}</b></div>
    <div class="line"><span>¿Ve el monto?</span><b>${c.ve_monto ? 'Sí' : 'No'}</b></div></div>
  <div class="card"><h2 style="margin-top:0">Pagos y saldo</h2>
    <div class="line"><span>Saldo</span><b class="${saldo > 0 ? 'saldo deuda' : ''}">${fmt(saldo)}</b></div>
    ${avPend.length ? `<div class="line"><span>Avisado, sin confirmar <span class="muted">(no descuenta)</span></span><span class="tag av">${avPend.length}</span></div>` : ''}
    <div class="muted" style="margin-top:6px">Pagos confirmados</div>
    ${pag.slice(0, 5).map(p => `<div class="line"><span>${fmtFecha(p.fecha)} · ${p.forma === 'efectivo' ? 'Efectivo' : 'Transferencia'}${p.tipo === 'parcial' ? ' (parcial)' : ''}${p.aNombreDe ? `<br><span class="muted">a nombre de ${esc(p.aNombreDe)}</span>` : ''}</span><span class="mon">${fmt(p.monto)}</span></div>`).join('') || '<span class="muted">Sin pagos confirmados.</span>'}
    <div class="gap"></div><button class="sec" onclick="verCuenta(${c.id})">Ver cuenta corriente</button></div>
  <div class="card"><h2 style="margin-top:0">Pagadores habituales</h2>
    ${listaPag.length ? listaPag.map(([n, k]) => `<div class="line"><span>${esc(n)}</span><span class="muted">${k} pago(s)</span></div>`).join('') : '<span class="muted">Todavía no hay pagos a nombre de otra persona.</span>'}</div>
  <div class="card"><h2 style="margin-top:0">Productos habituales</h2>
    ${habit.length ? habit.map(([id, k]) => `<div class="line"><span>${esc(prod(+id).nombre)}</span><span class="muted">en ${k.n} de ${ordenes(c).length} pedidos</span></div>`).join('') : '<span class="muted">Todavía no hay pedidos.</span>'}</div>
  <div class="card"><h2 style="margin-top:0">Historial de pedidos</h2>
    ${ord.length ? ord.map(o => `<div class="line"><span>${fmtFecha(o.fecha)} ${o.pend ? '<span class="tag av">pendiente</span>' : ''}</span><span>${o.items.length} ítem(s)</span></div>`).join('') : '<span class="muted">Sin pedidos.</span>'}</div>
  <div class="card"><h2 style="margin-top:0">Observaciones</h2>
    <textarea aria-label="Observaciones" placeholder="Ej: pausó por vacaciones" oninput="st.obs=this.value">${esc(st.obs)}</textarea>
    <p class="muted">Si escribís "pausa" o "pausó", el cliente no aparece en Seguimiento.</p>
    <button class="ok" onclick="guardarObs(${c.id})">Guardar observaciones</button></div>`;
}
function guardarObs(id){
  S.fichas[id] = Object.assign({}, S.fichas[id], {obs: st.obs || ''});
  guardar(); flash('Observaciones guardadas.'); render();
}

/* =====================================================
   4. SEGUIMIENTO
   ===================================================== */
function motivoSeguimiento(c){
  if (enPausa(c) || c.diaVisita == null) return null;
  const o = ordenes(c);
  if (!o.length) return null; // sin pedidos nunca hubo qué seguir
  const ult = ultimaFecha(c.diaVisita), prev = sumarDias(ult, -7);
  if (!o.some(x => x.fecha > prev)) return {tipo:'nopidio', texto:`No pidió para su visita del ${DIAS[c.diaVisita]} ${fmtFecha(ult)}`};
  if (o.length >= 2){
    const a = o[o.length - 1], b = o[o.length - 2];
    if (a.items.length < b.items.length) return {tipo:'menos', texto:`Pidió menos: ${a.items.length} ${a.items.length === 1 ? 'producto' : 'productos'} (antes ${b.items.length})`};
  }
  return null;
}
function rSeguir(){
  const lista = clientesTodos().map(c => ({c, m: motivoSeguimiento(c)})).filter(x => x.m);
  return `<h1>Seguimiento</h1>
  <div class="warn"><b>Criterios de demo.</b> Los criterios reales se definen con datos reales.</div>
  <p class="muted">No pidió: no hizo pedido desde su visita anterior y ya pasó su último día de visita. Pidió menos: el último pedido tiene menos productos que el anterior.</p>
  ${lista.length ? lista.map(x => `<div class="card"><div class="line" style="border:0;padding:0"><span><b>${esc(x.c.nombre)}</b><br><span class="muted">${esc(x.m.texto)}</span></span>
    <span class="tag ${x.m.tipo === 'nopidio' ? 'bad' : 'av'}">${x.m.tipo === 'nopidio' ? 'No pidió' : 'Pidió menos'}</span></div>
    <div class="gap"></div><button disabled>Armar mensaje</button><p class="muted" style="margin:4px 0 0;text-align:center">Disponible en la próxima etapa</p></div>`).join('') : '<div class="card muted">No hay clientes para contactar.</div>'}`;
}
function armarMensaje(cid, tipo){ st.m = {tipo, cid, texto:plantilla(tipo, clienteDe(cid))}; go('mensajes'); }

/* =====================================================
   5. MENSAJES
   ===================================================== */
const TIPOS = {dia:'Día anterior a la visita', seg:'Seguimiento'};
function plantilla(tipo, c){
  const link = new URL('pedido.html', location.href).href;
  return tipo === 'dia'
    ? `Hola ${c.nombre}. Mañana pasamos por tu negocio. ¿Qué vas a necesitar? Podés armar tu pedido o avisar tu pago acá: ${link}`
    : `Hola ${c.nombre}. Hace unos días que no recibimos tu pedido. ¿Querés que te pasemos lo de siempre? Armalo acá: ${link}`;
}
// Un cliente que no ve montos nunca debe recibir importes
function conMontos(c, texto){ return !c.ve_monto && /\$|\d{3,}/.test(texto.replace(/https?:\/\/\S+/g, '')); }
function rMensajes(){
  const todos = clientesTodos(), manana = (new Date().getDay() + 1) % 7;
  if (!st.m.cid || !clienteDe(st.m.cid)) st.m.cid = (todos.find(c => c.diaVisita === manana) || todos[0]).id;
  const c = clienteDe(st.m.cid);
  if (!st.m.texto) st.m.texto = plantilla(st.m.tipo, c);
  const hist = S.mensajes.slice(0, 15);
  return `<h1>Mensajes</h1>
  <p class="muted">Demo: no se envía nada. El mensaje se copia y se marca como enviado.</p>
  <div class="seg"><button class="${st.m.tipo==='dia'?'on':''}" onclick="cambiarPlantilla('dia')">Día anterior</button><button class="${st.m.tipo==='seg'?'on':''}" onclick="cambiarPlantilla('seg')">Seguimiento</button></div>
  <label for="m-cli">Cliente</label>
  <select id="m-cli" onchange="st.m.cid=+this.value;st.m.texto=plantilla(st.m.tipo,clienteDe(st.m.cid));render()">${todos.map(x => `<option value="${x.id}" ${x.id === c.id ? 'selected' : ''}>${esc(x.nombre)}${x.diaVisita === manana ? ' (mañana tiene visita)' : ''}</option>`).join('')}</select>
  <label for="m-texto">Mensaje (podés editarlo)</label>
  <textarea id="m-texto" oninput="st.m.texto=this.value;pintarMsg()">${esc(st.m.texto)}</textarea>
  <div class="wa"><div class="bubble" id="m-burbuja"></div></div>
  <div id="m-aviso"></div>
  <div class="row"><button id="m-copiar" class="sec" onclick="copiarMsg()">Copiar texto</button><button id="m-enviado" class="ok" onclick="marcarEnviado()">Marcar como enviado</button></div>
  <h2>Historial de mensajes</h2>
  <div class="card">${hist.length ? hist.map(m => `<div class="line"><span><b>${esc(nombreCli(m.clienteId))}</b><br><span class="muted">${TIPOS[m.tipo]}</span></span><span class="muted">${fmtFechaHora(m.ts)}</span></div>`).join('') : '<span class="muted">Todavía no se marcó ningún mensaje como enviado.</span>'}</div>`;
}
function cambiarPlantilla(t){ st.m.tipo = t; st.m.texto = plantilla(t, clienteDe(st.m.cid)); render(); }
function pintarMsg(){
  const c = clienteDe(st.m.cid), b = document.getElementById('m-burbuja'); if (!b) return;
  const hh = new Date(); b.innerHTML = esc(st.m.texto) + `<small>${pad2(hh.getHours())}:${pad2(hh.getMinutes())} ✓✓</small>`;
  const malo = conMontos(c, st.m.texto);
  document.getElementById('m-aviso').innerHTML = malo ? '<div class="warn">Este cliente no ve montos: sacá los importes del mensaje para poder enviarlo.</div>' : '';
  document.getElementById('m-copiar').disabled = malo; document.getElementById('m-enviado').disabled = malo || !st.m.texto.trim();
}
function copiarMsg(){
  const t = st.m.texto, ok = () => { flash('Texto copiado.'); render(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok).catch(() => fallbackCopiar(t, ok));
  else fallbackCopiar(t, ok);
}
function fallbackCopiar(t, ok){
  const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch(e){}
  ta.remove(); ok();
}
function marcarEnviado(){
  const c = clienteDe(st.m.cid); if (conMontos(c, st.m.texto) || !st.m.texto.trim()) return;
  S.mensajes.unshift({id:nuevoId('m'), clienteId:c.id, tipo:st.m.tipo, ts:new Date().toISOString(), texto:st.m.texto});
  guardar(); flash('Registrado en el historial de mensajes.'); st.m.texto = ''; render();
}

/* ---------- pantalla ---------- */
function render(){
  S = f2Load();
  const pend = pendientes().length;
  document.getElementById('tabs').innerHTML = TABS.map(t => `<button class="${st.tab === t[0] ? 'on' : ''}" onclick="go('${t[0]}')"><span class="ic">${t[1]}</span>${t[2]}${t[0] === 'cuentas' && pend ? `<span class="bdg">${pend}</span>` : ''}</button>`).join('');
  const f = st.flash; st.flash = '';
  const cuerpo = {cuentas:rCuentas, ficha:rFicha, seguir:rSeguir, mensajes:rMensajes}[st.tab]();
  $app.innerHTML = (f ? `<div class="msg">${esc(f)}</div>` : '') + cuerpo;
  if (st.tab === 'mensajes') pintarMsg();
}
// si el cliente avisa un pago en otra pestaña, se refresca al volver a esta
window.addEventListener('focus', () => { if (!Object.keys(st.pe).length && !Object.keys(st.ed).length && st.tab === 'cuentas') render(); });
render();
</script>
</body>
